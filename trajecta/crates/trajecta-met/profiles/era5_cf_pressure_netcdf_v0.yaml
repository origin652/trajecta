schema_version: 0
kind: dataset_profile
name: era5-cf-pressure-netcdf-v0
fingerprint:
  attributes:
    dataset_family: era5_cf_pressure_netcdf
source_matchers:
  # Official Copernicus CDS cfgrib NetCDF4 (pressure + surface multi-file).
  - format: netcdf4
    global_attributes:
      dataset_family: era5_cf_pressure_netcdf
  # Offline classic NetCDF3 conversions of the same logical product.
  - format: netcdf3
    global_attributes:
      dataset_family: era5_cf_pressure_netcdf
frame_interval_seconds: 21600
extension_fields:
  - target:
      namespace: era5
      name: pressure_geopotential
    unit: m2/s2
    shape: full3_d
  - target:
      namespace: era5
      name: downward_sensible_heat_flux
    unit: kg/s3
    shape: horizontal2_d
  - target:
      namespace: era5
      name: downward_moisture_flux
    unit: kg m-2 s-1
    shape: horizontal2_d
  - target:
      namespace: era5
      name: two_metre_dewpoint_temperature
    unit: K
    shape: horizontal2_d
fields:
  - id: air_temperature
    target: air_temperature
    sources:
      - identity: { role: pressure, variable: t, layout: full3_d }
        unit: K
  - id: eastward_wind
    target: eastward_wind
    sources:
      - identity: { role: pressure, variable: u, layout: full3_d }
        unit: m/s
  - id: northward_wind
    target: northward_wind
    sources:
      - identity: { role: pressure, variable: v, layout: full3_d }
        unit: m/s
  - id: pressure_vertical_velocity
    target: pressure_vertical_velocity
    sources:
      - identity: { role: pressure, variable: w, layout: full3_d }
        unit: Pa/s
  - id: specific_humidity
    target: specific_humidity
    sources:
      - identity: { role: pressure, variable: q, layout: full3_d }
        unit: "1"
  - id: pressure_geopotential
    target:
      namespace: era5
      name: pressure_geopotential
    sources:
      # 3-D pressure-level geopotential; role+layout disambiguates surface z.
      - identity: { role: pressure, variable: z, layout: full3_d }
        unit: m2/s2
  - id: surface_pressure
    target: surface_pressure
    sources:
      - identity: { role: surface, variable: sp, layout: horizontal2_d }
        unit: Pa
  - id: surface_geopotential
    target: surface_geopotential
    sources:
      - identity: { role: surface, variable: z, layout: horizontal2_d }
        unit: m2/s2
  - id: ten_metre_eastward_wind
    target: ten_metre_eastward_wind
    sources:
      - identity: { role: surface, variable: u10, layout: horizontal2_d }
        unit: m/s
  - id: ten_metre_northward_wind
    target: ten_metre_northward_wind
    sources:
      - identity: { role: surface, variable: v10, layout: horizontal2_d }
        unit: m/s
  - id: two_metre_air_temperature
    target: two_metre_air_temperature
    sources:
      - identity: { role: surface, variable: t2m, layout: horizontal2_d }
        unit: K
  - id: two_metre_dewpoint_temperature
    target:
      namespace: era5
      name: two_metre_dewpoint_temperature
    sources:
      - identity: { role: surface, variable: d2m, layout: horizontal2_d }
        unit: K
  - id: aerodynamic_roughness_length
    target: aerodynamic_roughness_length
    sources:
      - identity: { role: surface, variable: fsr, layout: horizontal2_d }
        unit: m
  - id: boundary_layer_height
    target: boundary_layer_height
    sources:
      - identity: { role: surface, variable: blh, layout: horizontal2_d }
        unit: m
  - id: friction_velocity
    target: friction_velocity
    sources:
      - identity: { role: surface, variable: zust, layout: horizontal2_d }
        unit: m/s
  # ECMWF ishf/ie are positive downward (params 231/232). Canonical fluxes are upward.
  - id: downward_sensible_heat_flux
    target:
      namespace: era5
      name: downward_sensible_heat_flux
    sources:
      - identity: { role: surface, variable: ishf, layout: horizontal2_d }
        unit: "W m-2"
  - id: downward_moisture_flux
    target:
      namespace: era5
      name: downward_moisture_flux
    sources:
      - identity: { role: surface, variable: ie, layout: horizontal2_d }
        unit: "kg m-2 s-1"
derived_fields:
  - id: geopotential_height
    target: geopotential_height
    expression: "geopotential_height(pressure_geopotential)"
    unit: m
    shape: full3_d
    stage: frame
    quality: derived
  - id: sensible_heat_flux
    target: sensible_heat_flux
    expression: "-downward_sensible_heat_flux"
    unit: kg/s3
    shape: horizontal2_d
    stage: frame
    quality: derived
  - id: latent_heat_flux
    target: latent_heat_flux
    expression: "latent_heat_from_moisture_flux(downward_moisture_flux)"
    unit: kg/s3
    shape: horizontal2_d
    stage: frame
    quality: derived
  - id: two_metre_specific_humidity
    target: two_metre_specific_humidity
    expression: "two_metre_specific_humidity_from_dewpoint(two_metre_dewpoint_temperature, surface_pressure)"
    unit: "1"
    shape: horizontal2_d
    stage: frame
    quality: derived
  - id: potential_vorticity
    target: potential_vorticity
    expression: "ertel_potential_vorticity(eastward_wind, northward_wind, air_temperature, surface_pressure)"
    unit: PVU
    shape: full3_d
    stage: tile
    quality: derived
capabilities:
  transport:
    - eastward_wind
    - northward_wind
    - pressure_vertical_velocity
    - air_temperature
    - specific_humidity
    - geopotential_height
    - surface_pressure
    - surface_geopotential
  near_surface_transport:
    - surface_geopotential
    - ten_metre_eastward_wind
    - ten_metre_northward_wind
    - two_metre_air_temperature
    - two_metre_specific_humidity
    - aerodynamic_roughness_length
    - boundary_layer_height
    - friction_velocity
    - sensible_heat_flux
    - latent_heat_flux
  domain_fill:
    - eastward_wind
    - northward_wind
    - air_temperature
    - specific_humidity
    - geopotential_height
    - surface_pressure
    - surface_geopotential
  diagnostics:
    - potential_vorticity
