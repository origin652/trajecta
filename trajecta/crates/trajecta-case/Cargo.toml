[package]
name = "trajecta-case"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compiler-checked Case, RunProfile, units, and validation contracts for Trajecta"

[lints]
workspace = true

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml 0.9 is unmaintained; serde_yml is the maintained drop-in for v0 Case YAML.
serde_yml = "0.0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
