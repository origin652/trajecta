[workspace]
resolver = "3"
exclude = ["vendor/trajecta-hdf5-control", "vendor/trajecta-local-ipc"]
members = [
    "crates/trajecta-case",
    "crates/trajecta-met",
    "crates/trajecta-core",
    "crates/trajecta-job",
    "crates/trajecta-cli",
]
default-members = [
    "crates/trajecta-case",
    "crates/trajecta-met",
    "crates/trajecta-core",
    "crates/trajecta-job",
    "crates/trajecta-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Trajecta contributors"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[patch.crates-io]
eccodes = { path = "vendor/eccodes" }
